spring.application.name=scheduler-backend

# The solver runs only for 15 seconds to avoid a HTTP timeout.
optaplanner.solver.termination.spent-limit=60s

# FIX (review 3.7): spent-limit alone means every solve burns the full 15 seconds even when the
# answer was found in 200ms. This second limit says "also stop if you haven't improved on the best
# score for 3 seconds", so small problems come back quickly. Whichever limit trips first wins.
#optaplanner.solver.termination.unimproved-spent-limit=10s